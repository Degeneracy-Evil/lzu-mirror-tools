# M4 rolling upgrades replace the Server before Agents. No publication
# filesystem is configured on the Server; that state is local to each Agent.
bind = "127.0.0.1:8080"
database_path = "/var/lib/lmt/lmt.db"
log_dir = "/var/lib/lmt/logs"
operator_token_file = "/etc/lmt/operator.token"
offline_after_seconds = 90

[logging]
level = "info"
format = "json"

[status]
public = false

[backup]
directory = "/var/lib/lmt/backups"

[run_logs]
retention = "30d"
max_total_bytes = 10737418240
maintenance_interval = "1h"
